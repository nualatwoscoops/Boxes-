<!DOCTYPE html>
<html lang="en-AU">
<head>
	<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2 Boxes</title>
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
<h1>Boxes</h1>
<div id="outer">
<h2>Controls</h2>
  <form id="myForm">
    <fieldset>
      <label for="btn1">Blue box sits inside the red box</label>
	  <input type="button" id="btn1" value="Click">
    </fieldset>
    <fieldset>
      <label for="btn2">Blue box sits under the red box</label>
	  <input type="button" id="btn2" value="Click">
    </fieldset>
    <fieldset>
      <label for="btn3">Blue box sits to the right of the red box</label>
	  <input type="button" id="btn3" value="Click">
    </fieldset>
    <fieldset>
      <label for="btn4">Red box sits to the right of the blue box</label>
	  <input type="button" id="btn4" value="Click">
    </fieldset>
    <fieldset>
      <label for="btn5">Blue box sits inside the red box and move the blue box 20px down and 45 pixels to the right of the top left hand corner of the red box</label>
	  <input type="button" id="btn5" value="Click">
    </fieldset>
    <fieldset>
      <label for="btn6">Green box around both the blue and red boxes</label>
	  <input type="button" id="btn6" value="Click">
    </fieldset>
  </form>
  <h2>Box display</h2>
  <!-- No need to edit this below -->
  <section id="boxes">
    <div id="green" class="hidden">
		<div id="red" >
		<div id="blueIn" class="hidden"></div></div>
    	<div id="blueBottom" class="hidden"></div>
    </div>
  </section>
  <!-- Finish - No need to edit this above -->
</div>
<script src="js/script.js"></script>
</body>
</html>
